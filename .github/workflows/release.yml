# This Workflow performs a full release of Che Code
name: Release Che Code
run-name: Release Che Code ${{ inputs.version }} on ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version that is going to be released. Should be in format 7.y.z'
        required: true
        default: '7.y.z'
      forceRecreateTags:
        description: If true, tags will be recreated. Use with caution
        required: false
        default: 'false'

jobs:
  tag-release:
    runs-on: ubuntu-22.04
    steps:
      -
        name: "Checkout Che Code source code"
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHE_INCUBATOR_BOT_TOKEN }}
      -
        name: "Display release parameters"
        env:
          VERSION: ${{ inputs.version }}
          FORCE_RECREATE_TAGS: ${{ inputs.forceRecreateTags }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          echo "=== Release Parameters ==="
          echo "Version: ${VERSION}"
          echo "Force recreate tags: ${FORCE_RECREATE_TAGS}"
          echo "Branch: ${REF_NAME}"
          echo "Commit SHA: ${COMMIT_SHA}"
          echo "Triggered by: ${TRIGGERED_BY}"
          echo "=========================="

          # Validate version format
          [[ "${VERSION}" =~ ^7\.[0-9]+\.[0-9]+$ ]] || { echo "[ERROR] Invalid version: ${VERSION}"; exit 1; }
      -
        name: "Setup Node"
        uses: actions/setup-node@v6
        with:
          node-version-file: 'code/.nvmrc'
      -
        name: Check existing tags
        env:
          RECREATE_TAGS: ${{ github.event.inputs.forceRecreateTags }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set +e
          EXISTING_TAG=$(git ls-remote --exit-code origin refs/tags/${VERSION})
          if [[ -n ${EXISTING_TAG} ]]; then
            if [[ ${RECREATE_TAGS} == "true" ]]; then
              echo "[INFO] Removing tag for ${VERSION} version. New tag will be recreated during release."
              git push origin :$VERSION
            else
              echo "[ERROR] Cannot proceed with release - tag ${EXISTING_TAG} already exists."
              exit 1
            fi
          else
            echo "[INFO] No existing tags detected for $VERSION"
          fi
      -
        name: "Tag release"
        env:
          VERSION: ${{ github.event.inputs.version }}
          GITHUB_TOKEN: ${{ secrets.CHE_INCUBATOR_BOT_TOKEN }}
        run: |
          git config --global user.name "Mykhailo Kuznietsov"
          git config --global user.email "mkuznets@redhat.com"
          git config --global pull.rebase true
          /bin/bash make-release.sh --version "${VERSION}" --tag-release

