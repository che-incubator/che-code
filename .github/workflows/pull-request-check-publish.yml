name: Publish Image PR check

on:
  workflow_run:
    workflows: ["Pull Request Check"]
    types:
      - completed

# Only the latest publish run for a given head branch should proceed, so a
# slower older run cannot overwrite the mutable pr-<number> tags after a newer one.
concurrency:
  group: pr-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:

  publish-images:
    # Skip builds that failed or were cancelled; we must not publish or comment for them.
    if: github.event.workflow_run.conclusion == 'success'
    name: publish image from the pull request
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Free up disk space
        run: |
          df -h
          rm -rf /opt/hostedtoolcache
          df -h

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_PULL_REQUESTS_USERNAME }}
          password: ${{ secrets.QUAY_PULL_REQUESTS_PASSWORD }}

      - name: Resolve Pull Request number
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          matches=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f "head=${HEAD_OWNER}:${HEAD_BRANCH}" \
            --jq ".[] | select(.head.sha == \"${HEAD_SHA}\") | .number")
          count=$(printf '%s\n' "${matches}" | grep -c '^[0-9]\+$' || true)
          if [ "${count}" -eq 0 ]; then
            echo "No open pull request found for ${HEAD_OWNER}:${HEAD_BRANCH} at ${HEAD_SHA}; nothing to publish"
            exit 1
          fi
          if [ "${count}" -ne 1 ]; then
            echo "Expected exactly one open PR for ${HEAD_OWNER}:${HEAD_BRANCH} at ${HEAD_SHA}, found ${count}"
            exit 1
          fi
          echo "Pull Request: ${matches}"
          echo "_PR_NUMBER=${matches}" >> "${GITHUB_ENV}"

      - name: Cleanup docker images
        run: |
          docker system prune -af

      - name: Download che-code docker image artifact
        uses: actions/download-artifact@v7
        with:
          pattern: che-*
          merge-multiple: true
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: List downloaded files
        run: |
          ls -lahR
      - name: Load che-code-amd64 image
        run: |
          docker load -i che-code-amd64.tgz

      - name: Push che-code-amd64 docker image
        run: |
          export IMAGE=quay.io/che-incubator-pull-requests/che-code:pr-${{env._PR_NUMBER}}-amd64
          docker tag che-code-amd64 ${IMAGE}
          docker push ${IMAGE}
          echo "_CHE_CODE_AMD64_IMAGE=${IMAGE}" >> $GITHUB_ENV
      
      - name: Remove che-code-amd64 and prune
        run: |
          docker image rm che-code-amd64 || true
          docker system prune -af

      - name: Load che-code-arm64 image
        run: |
          docker load -i che-code-arm64.tgz

      - name: Push che-code-arm64 docker image
        run: |
          export IMAGE=quay.io/che-incubator-pull-requests/che-code:pr-${{env._PR_NUMBER}}-arm64
          docker tag che-code-arm64 ${IMAGE}
          docker push ${IMAGE}
          echo "_CHE_CODE_ARM64_IMAGE=${IMAGE}" >> $GITHUB_ENV
      
      - name: Remove che-code-arm64 and prune
        run: |
          docker image rm che-code-arm64 || true
          docker system prune -af

      - name: Load che-dev image
        run: |
          docker load -i che-dev.tgz

      - name: Push che-dev docker image
        run: |
          export IMAGE=quay.io/che-incubator-pull-requests/che-code-dev:pr-${{env._PR_NUMBER}}-dev-amd64
          docker tag che-dev ${IMAGE}
          docker push ${IMAGE}
          echo "_CHE_DEV_IMAGE=${IMAGE}" >> $GITHUB_ENV
      
      - name: Remove che-dev and prune
        run: |
          docker image rm che-dev || true
          docker system prune -af
          
      - name: 'Comment PR'
        uses: actions/github-script@v8
        with:
         script: |
           const tagUrl = (image) => {
             const [path, tag] = image.replace(/^quay\.io\//, '').split(':');
             return `https://quay.io/repository/${path}?tab=tags&tag=${tag}`;
           };
           await github.rest.issues.createComment({
              issue_number: process.env._PR_NUMBER,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Pull Request images published ✨\n\nEditor amd64: [${process.env._CHE_CODE_AMD64_IMAGE}](${tagUrl(process.env._CHE_CODE_AMD64_IMAGE)})\nEditor arm64: [${process.env._CHE_CODE_ARM64_IMAGE}](${tagUrl(process.env._CHE_CODE_ARM64_IMAGE)})\nDev image: [${process.env._CHE_DEV_IMAGE}](${tagUrl(process.env._CHE_DEV_IMAGE)})`
            })
